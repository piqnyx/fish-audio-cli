name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  persist-credentials: false

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Check formatting
              shell: bash
              run: |
                  unformatted="$(gofmt -l .)"
                  if [[ -n "$unformatted" ]]; then
                      printf 'Files are not formatted:\n%s\n' "$unformatted"
                      exit 1
                  fi

            - name: Run vet
              run: go vet ./...

            - name: Run tests
              run: go test -count=1 ./...

            - name: Run race detector
              run: go test -race -count=1 ./...

            - name: Build executable
              run: go build -trimpath -o /tmp/fish-audio-cli ./cmd/fish-audio-cli
